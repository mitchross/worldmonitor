# Daily sync from upstream koala73/worldmonitor.
#
# Merges upstream/main onto a dedicated branch and opens a pull request
# against this fork's main. It never pushes to main directly, so your
# fork-specific commits are never touched until you review and merge the PR.
#
# - No new upstream commits  -> nothing happens.
# - Clean merge              -> a PR is opened/updated, ready to merge.
# - Merge conflicts          -> the conflicted state is committed and the PR
#                               is marked as a draft so you can resolve the
#                               markers in the PR instead of the job dying.
#
# Merging the PR is a normal push to main, which triggers the image rebuild
# (docker-publish-selfhosted.yml) on its own.

name: Sync from upstream

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch:     # manual trigger

concurrency:
  group: sync-upstream
  cancel-in-progress: true

env:
  UPSTREAM_URL: https://github.com/koala73/worldmonitor.git
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: sync/upstream-main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the sync branch
      pull-requests: write    # open/update the PR

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
          # The default GITHUB_TOKEN (the default "GitHub Actions" app) can
          # NEVER push changes to .github/workflows/* on a fork — no fork
          # setting can grant it workflows permission. A personal access
          # token stored as SYNC_TOKEN can. Falls back to the default token
          # when the secret is absent (in which case syncs that touch
          # workflow files will keep failing on the push).
        with:
          # (input, not step env — checkout defaults `token` to github.token
          # and never consults the step environment)
          token: ${{ secrets.SYNC_TOKEN || github.token }}
          persist-credentials: true
          fetch-depth: 0       # full history so the merge base is available
          ref: main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null \
            || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Check for new upstream commits
        id: check
        run: |
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" origin/main; then
            echo "Already up to date with upstream. Nothing to do."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream onto sync branch
        if: steps.check.outputs.has_changes == 'true'
        id: merge
        run: |
          git checkout -B "$SYNC_BRANCH" origin/main
          if git merge "upstream/$UPSTREAM_BRANCH" --no-edit; then
            echo "Clean merge."
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            echo "Merge conflicts — committing conflicted state for manual resolution in the PR."
            git add -A
            git commit --no-edit
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
          fi
          git push --force-with-lease origin "$SYNC_BRANCH"

      - name: Open or update pull request
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          if [ "$CONFLICTS" = "true" ]; then
            title="⚠️ Sync from upstream (CONFLICTS — resolve before merging)"
            body=$'Automated daily merge of `upstream/main`.\n\n**This merge had conflicts.** The conflicted state was committed as-is; resolve the conflict markers on this branch, then mark the PR ready and merge.\n\nYour fork commits are preserved — nothing was pushed to `main`.'
            draft_flag="--draft"
          else
            title="Sync from upstream"
            body=$'Automated daily merge of `upstream/main`. Merged cleanly.\n\nReview and merge to bring your fork up to date. Your fork commits are preserved.'
            draft_flag=""
          fi

          existing=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Updating existing PR #$existing (branch already force-pushed)."
            gh pr edit "$existing" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$SYNC_BRANCH" \
              --title "$title" --body "$body" $draft_flag
          fi
