# Publish self-hosted Docker images to GHCR.
# Builds the 3 images needed for a full self-hosted deployment:
#   - worldmonitor       (root Dockerfile — nginx + Node.js API sidecar)
#   - worldmonitor-relay (Dockerfile.relay — AIS relay WebSocket server)
#   - worldmonitor-redis-rest (docker/Dockerfile.redis-rest — Upstash-compatible REST proxy)
#
# These are NOT published by upstream — only the frontend-only image (docker/Dockerfile) is.

name: Publish self-hosted Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

# Overlapping runs race on the :main tag (last to finish wins, which may be
# the older commit). Daily upstream syncs re-trigger this, so cancel stale runs.
concurrency:
  group: docker-publish-selfhosted
  cancel-in-progress: true

jobs:
  # ── Main app (nginx + Node.js API) ──────────────────────────────────────
  app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/worldmonitor
          tags: |
            type=raw,value=main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VITE_SELF_HOSTED=true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=worldmonitor-app
          cache-to: type=gha,mode=max,scope=worldmonitor-app

  # ── AIS Relay ───────────────────────────────────────────────────────────
  relay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/worldmonitor-relay
          tags: |
            type=raw,value=main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Dockerfile.relay
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=worldmonitor-relay
          cache-to: type=gha,mode=max,scope=worldmonitor-relay

  # ── Redis REST Proxy ────────────────────────────────────────────────────
  redis-rest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/worldmonitor-redis-rest
          tags: |
            type=raw,value=main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          # The Dockerfile COPYs redis-rest-proxy.mjs relative to docker/, not repo root.
          context: ./docker
          file: docker/Dockerfile.redis-rest
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=worldmonitor-redis-rest
          cache-to: type=gha,mode=max,scope=worldmonitor-redis-rest